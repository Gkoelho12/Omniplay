<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adicionar Amigos — OmniPlay</title>
  <meta name="description" content="Adiciona amigos no OmniPlay, partilha o teu código pessoal e desafia amigos para jogar Mexicana e outros jogos multiplayer.">
  <meta name="theme-color" content="#07080d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="brand" href="index.html" id="btn-back-brand" aria-label="Voltar ao Hub">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
        </defs>
        <circle cx="32" cy="32" r="26" fill="none" stroke="url(#lg1)" stroke-width="6"/>
        <path d="M20 32c0-5 3.5-8 7-8 6 0 5 16 11 16 3.5 0 7-3 7-8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" opacity=".9"/>
      </svg>
      <span class="brand-name">Omni<b>Play</b></span>
    </a>

    <div class="mx-top-title">
      <span class="setup-ic">👥</span>
      <b>Amigos</b>
      <span class="room-chip">Conexões</span>
    </div>

    <div class="top-right">
      <span class="mx-user-pill glass" id="amigos-user-pill"></span>
      <a class="btn btn-sm btn-ghost" href="mexicana.html" id="btn-mexicana-top">🃏 Mexicana</a>
      <a class="btn btn-sm btn-ghost" href="index.html" id="btn-exit-top">← Menu</a>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <div id="amigos-root" class="page friends-page"></div>
  </main>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/session.js"></script>
  <script src="js/amigos_page.js"></script>
</body>
</html>
